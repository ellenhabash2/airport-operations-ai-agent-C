services:
  postgres:
    image: postgres:16-alpine
    container_name: aeromind_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aeromind}
      POSTGRES_USER: ${POSTGRES_USER:-aeromind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeromind_password}
      POSTGRES_INITDB_ARGS: "-c max_connections=100"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aeromind_user} -d ${POSTGRES_DB:-aeromind}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aeromind_network
    restart: unless-stopped

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-aeromind}
      PGUSER: ${POSTGRES_USER:-aeromind_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-aeromind_password}
    volumes:
      - ./sql/upgrades/phase7_rich_conversation_memory.sql:/migrations/phase7_rich_conversation_memory.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/phase7_rich_conversation_memory.sql"]
    networks:
      - aeromind_network
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aeromind_backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-aeromind}
      DB_USER: ${POSTGRES_USER:-aeromind_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aeromind_password}
      PORT: 8848
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      AGENT_HISTORY_MAX_TURNS: ${AGENT_HISTORY_MAX_TURNS:-30}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required. Copy .env.example to .env and set it.}
    ports:
      - "8848:8848"
    networks:
      - aeromind_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  aeromind_network:
    driver: bridge
